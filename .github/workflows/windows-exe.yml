name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    paths:
      - 'windows_app/**'
      - '.github/workflows/windows-exe.yml'
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r windows_app/requirements.txt
      - name: Build EXE
        working-directory: windows_app
        run: pyinstaller --noconfirm --clean --onefile --windowed --name BulletinAgreage main.py
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: BulletinAgreage-Windows
          path: windows_app/dist/BulletinAgreage.exe
